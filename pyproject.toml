[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-maploc"
version = "0.1.0"
description = "BEV-to-vector-map localization with motion-guided temporal fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["temporal_maploc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

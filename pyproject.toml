[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-maploc"
version = "0.1.0"
description = "BEV-to-vector-map localization with motion-guided temporal fusion"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Zelong Zheng"},
]
keywords = [
  "visual localization",
  "autonomous driving",
  "bird's-eye view",
  "vector map",
  "SE(2)",
  "temporal fusion",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/Zelong-G/visual-map-localization"
Documentation = "https://github.com/Zelong-G/visual-map-localization/tree/main/docs"

[tool.setuptools.packages.find]
include = ["temporal_maploc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

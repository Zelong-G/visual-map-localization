name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          python -m pip install "PyYAML>=6.0" "pytest>=8.0"
          python -m pip install -e . --no-deps

      - name: Run unit tests
        run: pytest -q

      - name: Run synthetic temporal contract
        run: python scripts/evaluate_temporal.py --config configs/temporal.yaml --synthetic

      - name: Run synthetic single-frame smoke benchmark
        run: python scripts/benchmark.py --config configs/single_frame.yaml --synthetic --iterations 1 --size 32 --device cpu
